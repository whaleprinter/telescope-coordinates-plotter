<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}hydroline{% endblock %}</title>
<script>
  // Set the theme before first paint, so there's no flash of the wrong
  // colors. Falls back to the OS preference if nothing was chosen before.
  (function () {
    var saved = localStorage.getItem("hydroline-theme");
    var theme = saved || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
    document.documentElement.setAttribute("data-theme", theme);
  })();
</script>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #12151a; --panel: #1a1f27; --border: #2a313c; --text: #e6e9ee;
    --muted: #8a93a1; --accent: #5fb3ff; --accent-text: #06121e;
    --error: #ff6b6b; --error-bg: #3a1a1a; --ok: #4ade80;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #f7f8fa; --panel: #ffffff; --border: #d8dce2; --text: #1a1f27;
    --muted: #6b7280; --accent: #1f6feb; --accent-text: #ffffff;
    --error: #d1242f; --error-bg: #fdecea; --ok: #1a7f37;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  header {
    padding: 16px 24px; border-bottom: 1px solid var(--border);
    display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
  }
  header h1 { font-size: 16px; margin: 0; }
  header .path { color: var(--muted); font-size: 12px; font-family: ui-monospace, monospace; }
  main { max-width: 960px; margin: 0 auto; padding: 24px; }
  fieldset {
    border: 1px solid var(--border); border-radius: 10px; margin: 0 0 20px;
    padding: 16px 20px 20px;
  }
  legend { padding: 0 8px; color: var(--accent); font-weight: 600; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px 20px; }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  input, select {
    width: 100%; background: var(--panel); border: 1px solid var(--border);
    color: var(--text); border-radius: 6px; padding: 7px 9px; font-size: 13px;
  }
  input:focus, select:focus { outline: 2px solid var(--accent); border-color: var(--accent); }
  .field { min-width: 0; }
  .actions { display: flex; gap: 12px; align-items: center; margin: 24px 0; }
  button {
    background: var(--accent); color: var(--accent-text); border: none;
    border-radius: 8px; padding: 10px 20px; font-size: 14px; font-weight: 600;
    cursor: pointer;
  }
  button.secondary { background: transparent; color: var(--text); border: 1px solid var(--border); }
  button:hover { filter: brightness(1.1); }
  .error {
    background: var(--error-bg); border: 1px solid var(--error); color: var(--error);
    border-radius: 8px; padding: 12px 16px; margin-bottom: 20px; white-space: pre-wrap;
  }
  .hint { color: var(--muted); font-size: 12px; margin: -8px 0 16px; }
  a { color: var(--accent); }
  .kind-group[hidden] { display: none; }
  #theme-toggle { margin-left: auto; padding: 6px 12px; font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>hydroline &mdash; configuration editor</h1>
  <span class="path">{{ config_path }}</span>
  <button type="button" id="theme-toggle" class="secondary" onclick="toggleTheme()"
          title="Switch between light and dark">&#9680; Theme</button>
</header>
<main>
{% block content %}{% endblock %}
</main>
<script>
  function toggleTheme() {
    var html = document.documentElement;
    var next = html.getAttribute("data-theme") === "light" ? "dark" : "light";
    html.setAttribute("data-theme", next);
    localStorage.setItem("hydroline-theme", next);
  }
</script>
</body>
</html>
